{% set python_min = "3.11" %}
{% set name = "django-todo" %}
{% set version = "2.7.0" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/{{ name | replace('-', '_') }}-{{ version }}.tar.gz
  sha256: 7390915d2460e7298f1d33c217c64d675ffbd009cb4aea03e4404628bf8dda0c

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=40.8.0
    - wheel
    - pip
  run:
    - faker
    - python >={{ python_min }}
    - django >=5.2
    - factory_boy
    - titlecase
    - bleach
    - django-autocomplete-light
    - html2text

test:
  imports:
    - todo
  commands:
    - pip check
  requires:
    - pip
    - python {{ python_min }}

about:
  home: http://django-todo.org
  summary: A multi-user, multi-group task management and assignment system for Django.
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - rxm7706
